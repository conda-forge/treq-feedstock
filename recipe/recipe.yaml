schema_version: 1

context:
  name: treq
  version: 26.7.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 43e728e12aca2d897c626cf07dc7b4392749b73de050a7d66e086cb3a6e15da9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - incremental >=24.7.2
    - hatchling
  run:
    - typing_extensions >=3.10.0
    - multipart
    - python >=${{ python_min }}
    - twisted >=22.10.0
    - hyperlink >=21.0.0
    - incremental >=24.7.2
    - attrs
tests:
  - python:
      imports:
        - treq
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE
  summary: Python requests like API built on top of Twisted's HTTP client
  homepage: https://github.com/twisted/treq
  repository: https://github.com/twisted/treq
  documentation: http://treq.readthedocs.io/

extra:
  recipe-maintainers:
    - synapticarbors
